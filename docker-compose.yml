services:
  backend:
    image: ${BACKEND_IMAGE:-hanbay-hotel-backend:local}
    build:
      context: .
      dockerfile: hotel-booking/Dockerfile
    restart: unless-stopped
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-local-minio}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-local-minio-password}
      SPRING_PROFILES_ACTIVE: prod
      TRUSTED_PROXY_REGEX: "172[.]30[.]67[.]10"
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-hanbay-local-docker-secret-change-before-production}
      JWT_ACCESS_TOKEN_EXPIRATION_SECONDS: ${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:-3600}
      JWT_ISSUER: ${JWT_ISSUER:-hotel-booking-system}
      REFRESH_TOKEN_EXPIRATION_SECONDS: ${REFRESH_TOKEN_EXPIRATION_SECONDS:-604800}
      CORS_ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-5173}
      ADMIN_DEFAULT_ENABLED: ${ADMIN_DEFAULT_ENABLED:-false}
      ADMIN_DEFAULT_EMAIL: ${ADMIN_DEFAULT_EMAIL:-admin@hanbay.local}
      ADMIN_DEFAULT_PHONE: ${ADMIN_DEFAULT_PHONE:-0900000001}
      ADMIN_DEFAULT_FULL_NAME: ${ADMIN_DEFAULT_FULL_NAME:-Hanbay Admin}
      ADMIN_DEFAULT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD:-}
      AI_CHAT_MODEL: openai
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-openai}
      AI_POLICY_RAG_ENABLED: ${AI_POLICY_RAG_ENABLED:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-provider-not-configured}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_EMBEDDING_DIMENSIONS: ${OPENAI_EMBEDDING_DIMENSIONS:-1536}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-onboarding@resend.dev}
      PASSWORD_RESET_FRONTEND_URL: http://localhost:${FRONTEND_PORT:-5173}/reset-password
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-support@hanbay-hotel.local}
      SEPAY_BANK_CODE: ${SEPAY_BANK_CODE:-Vietcombank}
      SEPAY_BANK_ACCOUNT_NUMBER: ${SEPAY_BANK_ACCOUNT_NUMBER:-0000000002}
      SEPAY_BANK_ACCOUNT_NAME: ${SEPAY_BANK_ACCOUNT_NAME:-CONG TY TNHH HANBAY HOTEL}
      SEPAY_WEBHOOK_API_KEY: ${SEPAY_WEBHOOK_API_KEY:-local-dev-webhook-key}
    ports:
      - "${BACKEND_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 10

  frontend:
    image: ${FRONTEND_IMAGE:-hanbay-hotel-frontend:local}
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    restart: unless-stopped
    networks:
      default:
        ipv4_address: 172.30.67.10
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy

  postgres:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg17}
    container_name: ${POSTGRES_CONTAINER_NAME}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: ${REDIS_IMAGE:-redis:8}
    container_name: ${REDIS_CONTAINER_NAME:-hotelbooking_redis}
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: hanbay-minio:RELEASE.2025-10-15T17-29-55Z
    build:
      context: ./deploy/minio
    command: server /data --console-address :9001
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-local-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-local-minio-password}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data

  pgadmin:
    image: ${PGADMIN_IMAGE}
    container_name: ${PGADMIN_CONTAINER_NAME}
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${PGADMIN_PORT}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  minio_data:
  postgres_data:
  pgadmin_data:
  redis_data:

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.67.0/24
