openapi: 3.0.3
info:
  title: API tính giá lưu trú theo từng đêm
  version: 1.0.0
  description: Đặc tả API HAN-43 đã được đối chiếu với implementation và regression test.
paths:
  /api/v1/pricing/stay-price-calculations:
    post:
      tags: [Định giá]
      operationId: calculateStayPrice
      summary: Tính giá từng đêm lưu trú của một hạng phòng
      x-authorization: PUBLIC
      security: []
      description: |
        Tính giá cuối cùng cho từng ngày trong khoảng `[checkInDate, checkOutDate)`.
        Tài nguyên được chọn là hạng phòng vì booking và quy tắc giá đều tham chiếu
        `room_type_id`; phòng vật lý chỉ được gán ở bước sau.

        Endpoint public để khách chưa đăng nhập có thể xem giá chính xác trước khi
        tiếp tục tạo booking. Thao tác chỉ đọc dữ liệu và không giữ inventory.

        NEED BUSINESS CONFIRMATION: Có nhiều quy tắc giá áp dụng cho cùng một đêm.
        Contract này chưa định nghĩa cách xử lý độ ưu tiên, cộng dồn hoặc xung đột quy tắc.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CalculateStayPriceRequest" }
            example:
              roomTypeId: 10000000-0000-0000-0000-000000000001
              checkInDate: "2026-08-20"
              checkOutDate: "2026-08-23"
      responses:
        "200":
          description: Tính giá lưu trú thành công
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/CalculateStayPriceApiResponse" }
              example:
                success: true
                message: Tính giá lưu trú thành công
                data:
                  roomType:
                    {
                      id: 10000000-0000-0000-0000-000000000001,
                      code: DLX,
                      name: Deluxe,
                    }
                  checkInDate: "2026-08-20"
                  checkOutDate: "2026-08-23"
                  numberOfNights: 3
                  nightlyPrices:
                    - { date: "2026-08-20", finalPrice: 1200000 }
                    - { date: "2026-08-21", finalPrice: 1350000 }
                    - { date: "2026-08-22", finalPrice: 1500000 }
                  totalPrice: 4050000
                timestamp: "2026-08-18T08:00:00Z"
        "400":
          description: Thiếu trường bắt buộc (VALIDATION_FAILED), JSON/UUID/ngày sai định dạng (MALFORMED_REQUEST), hoặc khoảng ngày/cấu hình pricing không hợp lệ (PRICING_VALIDATION_FAILED)
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/ApiErrorResponse" } },
            }
        "404":
          description: Hạng phòng không tồn tại hoặc không hoạt động trong danh mục dành cho khách hàng
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/ApiErrorResponse" } },
            }
        "500":
          description: Dữ liệu giá không tồn tại hoặc không nhất quán; cách ánh xạ lỗi công khai cần được xác nhận
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/ApiErrorResponse" } },
            }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    CalculateStayPriceRequest:
      type: object
      additionalProperties: false
      required: [roomTypeId, checkInDate, checkOutDate]
      properties:
        roomTypeId:
          {
            type: string,
            format: uuid,
            description: ID của hạng phòng đang hoạt động; không chấp nhận ID phòng vật lý.,
          }
        checkInDate:
          {
            type: string,
            format: date,
            description: Ngày lưu trú đầu tiên; không được ở quá khứ theo quy tắc tìm phòng hiện tại.,
          }
        checkOutDate:
          {
            type: string,
            format: date,
            description: Ngày kết thúc không bao gồm trong thời gian lưu trú; phải sau checkInDate.,
          }
    CalculateStayPriceApiResponse:
      type: object
      required: [success, message, data, timestamp]
      properties:
        success: { type: boolean, enum: [true] }
        message: { type: string }
        data: { $ref: "#/components/schemas/CalculateStayPriceResponse" }
        timestamp: { type: string, format: date-time }
    CalculateStayPriceResponse:
      type: object
      required:
        [
          roomType,
          checkInDate,
          checkOutDate,
          numberOfNights,
          nightlyPrices,
          totalPrice,
        ]
      properties:
        roomType: { $ref: "#/components/schemas/RoomTypeSummary" }
        checkInDate: { type: string, format: date }
        checkOutDate: { type: string, format: date }
        numberOfNights: { type: integer, format: int32, minimum: 1 }
        nightlyPrices:
          type: array
          minItems: 1
          description: Sắp xếp tăng dần theo ngày; mỗi ngày lưu trú xuất hiện đúng một lần.
          items: { $ref: "#/components/schemas/NightlyPrice" }
        totalPrice:
          {
            type: integer,
            format: int64,
            minimum: 0,
            description: "Tổng chính xác của nightlyPrices[*].finalPrice, đơn vị VND.",
          }
    RoomTypeSummary:
      type: object
      required: [id, code, name]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
    NightlyPrice:
      type: object
      required: [date, finalPrice]
      properties:
        date: { type: string, format: date }
        finalPrice:
          {
            type: integer,
            format: int64,
            minimum: 0,
            description: Giá cuối cùng của đêm này,
            đơn vị VND.,
          }
    ApiErrorResponse:
      type: object
      required: [code, message, path, timestamp, errors]
      properties:
        code: { type: string, example: VALIDATION_FAILED }
        message: { type: string }
        path: { type: string, example: /api/v1/pricing/stay-price-calculations }
        timestamp: { type: string, format: date-time }
        errors:
          type: object
          additionalProperties: { type: string }
