openapi: 3.0.3

info:
  title: API danh sách khách đến hôm nay
  version: 1.0.0
  description: |
    API Front Desk trả danh sách booking dự kiến nhận phòng trong ngày hiện tại
    của khách sạn. Ngày hiện tại được xác định theo múi giờ `Asia/Ho_Chi_Minh`.

    Chỉ booking có `checkInDate` bằng ngày hiện tại và trạng thái `CONFIRMED`
    được trả về. Booking `PENDING`, `CHECKED_IN`, `CHECKED_OUT`, `CANCELLED`
    hoặc `EXPIRED` không thuộc danh sách này.

servers:
  - url: http://localhost:8080

tags:
  - name: Front Desk
    description: Nghiệp vụ vận hành quầy lễ tân

paths:
  /api/v1/front-desk/arrivals/today:
    get:
      tags: [Front Desk]
      summary: Xem danh sách khách dự kiến đến hôm nay
      description: |
        API giới hạn cho các vai trò `RECEPTIONIST`, `MANAGER` và `ADMIN`.

        Kết quả chỉ chứa booking `CONFIRMED` có ngày nhận phòng bằng ngày hiện
        tại theo `Asia/Ho_Chi_Minh`. Kết quả được sắp xếp theo `createdAt` tăng
        dần, sau đó theo `bookingCode` tăng dần để bảo đảm thứ tự ổn định.

        API không hỗ trợ tìm kiếm hoặc lọc trạng thái. Thông tin phòng vật lý và
        trạng thái gán phòng không thuộc contract này.
      operationId: getTodayArrivals
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Lấy danh sách khách đến hôm nay thành công; content có thể rỗng
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodayArrivalsResponse"
              examples:
                withData:
                  summary: Có khách dự kiến đến
                  value:
                    success: true
                    message: Lấy danh sách khách đến hôm nay thành công
                    data:
                      content:
                        - bookingId: 6fda28a3-4c69-4676-bacd-c50dfb722f71
                          bookingCode: HAN-20260819-001
                          primaryGuest:
                            fullName: Nguyễn Văn A
                            phone: "0901234567"
                            email: guest@example.com
                          roomType:
                            id: f36bc078-b09e-4d14-a3dc-83a7f4ac25c4
                            code: DLX
                            name: Deluxe
                          checkInDate: "2026-08-19"
                          checkOutDate: "2026-08-21"
                          adultCount: 2
                          childCount: 1
                          bookingStatus: CONFIRMED
                          createdAt: "2026-08-10T08:30:00Z"
                      page: 0
                      size: 20
                      totalElements: 1
                      totalPages: 1
                      first: true
                      last: true
                    timestamp: "2026-08-19T03:00:00Z"
                empty:
                  summary: Không có khách dự kiến đến
                  value:
                    success: true
                    message: Lấy danh sách khách đến hôm nay thành công
                    data:
                      content: []
                      page: 0
                      size: 20
                      totalElements: 0
                      totalPages: 0
                      first: true
                      last: true
                    timestamp: "2026-08-19T03:00:00Z"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/AccessForbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token của tài khoản nhân sự HANBAY

  parameters:
    Page:
      name: page
      in: query
      description: Số trang, bắt đầu từ 0
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      description: Số booking trên một trang
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    ValidationFailed:
      description: Query parameter không hợp lệ
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
          example:
            code: VALIDATION_FAILED
            message: Dữ liệu gửi lên không hợp lệ
            path: /api/v1/front-desk/arrivals/today
            timestamp: "2026-08-19T03:00:00Z"
            errors:
              size: Số phần tử mỗi trang phải từ 1 đến 100
    AuthenticationRequired:
      description: Thiếu, sai hoặc hết hạn access token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
          example:
            code: AUTH_UNAUTHORIZED
            message: Bạn cần đăng nhập để thực hiện thao tác này
            path: /api/v1/front-desk/arrivals/today
            timestamp: "2026-08-19T03:00:00Z"
            errors: {}
    AccessForbidden:
      description: Tài khoản không có vai trò được phép truy cập Front Desk
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
          example:
            code: AUTH_FORBIDDEN
            message: Bạn không có quyền truy cập
            path: /api/v1/front-desk/arrivals/today
            timestamp: "2026-08-19T03:00:00Z"
            errors: {}
    InternalServerError:
      description: Lỗi hệ thống ngoài dự kiến
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
          example:
            code: INTERNAL_SERVER_ERROR
            message: Đã xảy ra lỗi hệ thống
            path: /api/v1/front-desk/arrivals/today
            timestamp: "2026-08-19T03:00:00Z"
            errors: {}

  schemas:
    TodayArrivalsResponse:
      type: object
      additionalProperties: false
      required: [success, message, data, timestamp]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Lấy danh sách khách đến hôm nay thành công
        data:
          $ref: "#/components/schemas/TodayArrivalsPage"
        timestamp:
          type: string
          format: date-time

    TodayArrivalsPage:
      type: object
      additionalProperties: false
      required: [content, page, size, totalElements, totalPages, first, last]
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/TodayArrivalItem"
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
        first:
          type: boolean
        last:
          type: boolean

    TodayArrivalItem:
      type: object
      additionalProperties: false
      required:
        - bookingId
        - bookingCode
        - roomType
        - checkInDate
        - checkOutDate
        - adultCount
        - childCount
        - bookingStatus
        - createdAt
      properties:
        bookingId:
          type: string
          format: uuid
        bookingCode:
          type: string
          maxLength: 50
        primaryGuest:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/PrimaryGuestSummary"
          description: |
            Khách có `isPrimary=true`. Null khi booking cũ bị thiếu khách chính;
            backend không dùng thông tin người đặt booking để thay thế.
        roomType:
          $ref: "#/components/schemas/ArrivalRoomTypeSummary"
        checkInDate:
          type: string
          format: date
        checkOutDate:
          type: string
          format: date
        adultCount:
          type: integer
          minimum: 1
        childCount:
          type: integer
          minimum: 0
        bookingStatus:
          type: string
          enum: [CONFIRMED]
        createdAt:
          type: string
          format: date-time

    PrimaryGuestSummary:
      type: object
      additionalProperties: false
      required: [fullName]
      properties:
        fullName:
          type: string
          maxLength: 150
        phone:
          type: string
          maxLength: 10
          nullable: true
        email:
          type: string
          format: email
          nullable: true
    ArrivalRoomTypeSummary:
      type: object
      additionalProperties: false
      required: [id, code, name]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          maxLength: 50
        name:
          type: string
          maxLength: 150

    ApiErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message, path, timestamp, errors]
      properties:
        code:
          type: string
        message:
          type: string
        path:
          type: string
        timestamp:
          type: string
          format: date-time
        errors:
          type: object
          additionalProperties:
            type: string
