openapi: 3.0.3
info:
  title: HANBAY Hotel Price Rule Management API
  version: 1.0.0
  description: Contract quan ly quy tac gia cho manager va administrator.

servers:
  - url: http://localhost:8080
    description: Moi truong phat trien cuc bo

tags:
  - name: Price Rule Management
    description: Quan ly quy tac phu thu va khuyen mai dung trong dynamic pricing

paths:
  /api/v1/management/price-rules:
    get:
      tags: [Price Rule Management]
      summary: Tra cuu danh muc quy tac gia
      operationId: getManagedPriceRules
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: search
          in: query
          description: Tim khong phan biet hoa thuong theo name.
          schema:
            type: string
            maxLength: 150
        - name: roomTypeId
          in: query
          description: Loc theo hang phong.
          schema:
            type: string
            format: uuid
        - name: ruleType
          in: query
          description: Loc theo loai quy tac gia. BASE khong thuoc API quan tri nay.
          schema:
            $ref: '#/components/schemas/ManageableRuleType'
        - name: active
          in: query
          description: Bo qua de lay ca active va inactive.
          schema:
            type: boolean
        - name: sort
          in: query
          description: Truong va chieu sap xep.
          schema:
            type: string
            default: startDate,desc
            pattern: '^(name|ruleType|adjustmentValue|startDate|endDate|priority|active|createdAt),(asc|desc)$'
      responses:
        '200':
          description: Tra cuu thanh cong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceRulePageApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Price Rule Management]
      summary: Tao quy tac gia
      operationId: createPriceRule
      description: Rule moi luon duoc tao o trang thai active; active khong duoc nhan trong request tao moi.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePriceRuleRequest'
      responses:
        '201':
          description: Tao thanh cong. Header Location tro den resource vua tao.
          headers:
            Location:
              schema:
                type: string
              example: /api/v1/management/price-rules/20000000-0000-0000-0000-000000000001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceRuleApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/RoomTypeNotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/management/price-rules/{id}:
    parameters:
      - $ref: '#/components/parameters/PriceRuleId'
    get:
      tags: [Price Rule Management]
      summary: Xem chi tiet quy tac gia
      operationId: getManagedPriceRule
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Tra cuu thanh cong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceRuleApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PriceRuleNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [Price Rule Management]
      summary: Cap nhat quy tac gia
      operationId: updatePriceRule
      description: id, active va audit fields la read-only; thay doi chi anh huong cac lan tinh gia/booking moi.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePriceRuleRequest'
      responses:
        '200':
          description: Cap nhat thanh cong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceRuleApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Khong tim thay price rule hoac room type active.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/management/price-rules/{id}/status:
    parameters:
      - $ref: '#/components/parameters/PriceRuleId'
    patch:
      tags: [Price Rule Management]
      summary: Kich hoat hoac ngung kich hoat quy tac gia
      operationId: updatePriceRuleStatus
      description: Deactivate thay cho hard-delete; inactive rule khong duoc dung cho cac lan tinh gia moi.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePriceRuleStatusRequest'
      responses:
        '200':
          description: Cap nhat trang thai thanh cong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceRuleApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PriceRuleNotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token phai chua role MANAGER hoac ADMIN.

  parameters:
    PriceRuleId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  schemas:
    ManageableRuleType:
      type: string
      enum: [WEEKEND, HOLIDAY, SEASONAL, PROMOTION]
      description: BASE khong duoc quan ly qua API nay vi gia co ban nam tren room_types.base_price.
    AdjustmentType:
      type: string
      enum: [FIXED, PERCENTAGE]
    CreatePriceRuleRequest:
      type: object
      additionalProperties: false
      required: [roomTypeId, name, ruleType, adjustmentType, adjustmentValue, startDate, endDate, priority]
      properties:
        roomTypeId:
          type: string
          format: uuid
          example: 10000000-0000-0000-0000-000000000001
        name:
          type: string
          minLength: 2
          maxLength: 150
          example: Weekend surcharge Deluxe
        ruleType:
          $ref: '#/components/schemas/ManageableRuleType'
        adjustmentType:
          $ref: '#/components/schemas/AdjustmentType'
        adjustmentValue:
          type: integer
          format: int64
          minimum: 0
          description: Voi FIXED la VND; voi PERCENTAGE la phan tram va toi da 100 trong MVP.
          example: 20
        startDate:
          type: string
          format: date
          example: 2026-09-01
        endDate:
          type: string
          format: date
          example: 2026-12-31
        priority:
          type: integer
          minimum: 0
          maximum: 1000
          example: 10
    UpdatePriceRuleRequest:
      type: object
      additionalProperties: false
      required: [roomTypeId, name, ruleType, adjustmentType, adjustmentValue, startDate, endDate, priority]
      properties:
        roomTypeId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 2
          maxLength: 150
        ruleType:
          $ref: '#/components/schemas/ManageableRuleType'
        adjustmentType:
          $ref: '#/components/schemas/AdjustmentType'
        adjustmentValue:
          type: integer
          format: int64
          minimum: 0
          description: Voi FIXED la VND; voi PERCENTAGE la phan tram va toi da 100 trong MVP.
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        priority:
          type: integer
          minimum: 0
          maximum: 1000
    UpdatePriceRuleStatusRequest:
      type: object
      additionalProperties: false
      required: [active]
      properties:
        active:
          type: boolean
    RoomTypeSummary:
      type: object
      required: [id, code, name]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
    PriceRuleManagementResponse:
      type: object
      required:
        - id
        - roomType
        - name
        - ruleType
        - adjustmentType
        - adjustmentValue
        - startDate
        - endDate
        - priority
        - active
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        roomType:
          $ref: '#/components/schemas/RoomTypeSummary'
        name:
          type: string
        ruleType:
          $ref: '#/components/schemas/ManageableRuleType'
        adjustmentType:
          $ref: '#/components/schemas/AdjustmentType'
        adjustmentValue:
          type: integer
          format: int64
          minimum: 0
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        priority:
          type: integer
          minimum: 0
          maximum: 1000
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          nullable: true
    PriceRulePage:
      type: object
      required: [content, page, size, totalElements, totalPages, first, last]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/PriceRuleManagementResponse'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
        first:
          type: boolean
        last:
          type: boolean
    PriceRuleApiResponse:
      type: object
      required: [success, message, data, timestamp]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
          $ref: '#/components/schemas/PriceRuleManagementResponse'
        timestamp:
          type: string
          format: date-time
    PriceRulePageApiResponse:
      type: object
      required: [success, message, data, timestamp]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Lay danh sach quy tac gia thanh cong
        data:
          $ref: '#/components/schemas/PriceRulePage'
        timestamp:
          type: string
          format: date-time
    ApiErrorResponse:
      type: object
      required: [code, message, path, timestamp, errors]
      properties:
        code:
          type: string
          example: VALIDATION_FAILED
        message:
          type: string
        path:
          type: string
        timestamp:
          type: string
          format: date-time
        errors:
          type: object
          additionalProperties:
            type: string

  responses:
    BadRequest:
      description: Request, query parameter hoac UUID khong hop le.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    Unauthorized:
      description: Thieu access token, token khong hop le hoac het han.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    Forbidden:
      description: Tai khoan khong co role MANAGER hoac ADMIN.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    RoomTypeNotFound:
      description: Khong tim thay hang phong active theo roomTypeId.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            code: ROOM_001
            message: Khong tim thay hang phong dang kinh doanh
            path: /api/v1/management/price-rules
            timestamp: 2026-08-29T08:00:00Z
            errors: {}
    PriceRuleNotFound:
      description: Khong tim thay quy tac gia.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            code: PRICE_RULE_NOT_FOUND
            message: Khong tim thay quy tac gia
            path: /api/v1/management/price-rules/20000000-0000-0000-0000-000000000001
            timestamp: 2026-08-29T08:00:00Z
            errors: {}
    Conflict:
      description: Xung dot du lieu khi cap nhat quy tac gia.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            code: PRICE_RULE_CONFLICT
            message: Xung dot du lieu khi cap nhat quy tac gia
            path: /api/v1/management/price-rules
            timestamp: 2026-08-29T08:00:00Z
            errors: {}
    InternalServerError:
      description: Loi he thong ngoai du kien.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
