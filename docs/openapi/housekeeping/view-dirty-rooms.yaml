openapi: 3.0.3

info:
  title: API vận hành dọn phòng
  version: 1.2.0
  description: |
    API Housekeeping trả danh sách phòng `DIRTY`/`CLEANING` và cho Housekeeper
    thực hiện state transition `DIRTY -> CLEANING -> AVAILABLE`.

servers:
  - url: http://localhost:8080

tags:
  - name: Housekeeping
    description: Nghiệp vụ vận hành buồng phòng

paths:
  /api/v1/housekeeping/rooms:
    get:
      tags: [Housekeeping]
      summary: Xem các phòng cần xử lý
      operationId: getRoomsRequiringCleaning
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Danh sách phòng DIRTY và CLEANING
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirtyRoomsResponse"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/AccessForbidden"
  /api/v1/housekeeping/rooms/{roomId}/start-cleaning:
    patch:
      tags: [Housekeeping]
      summary: Bắt đầu dọn phòng DIRTY
      operationId: startCleaning
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200":
          $ref: "#/components/responses/RoomMutationSucceeded"
        "409":
          description: Phòng không còn ở trạng thái DIRTY
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/AccessForbidden"
  /api/v1/housekeeping/rooms/{roomId}/complete-cleaning:
    patch:
      tags: [Housekeeping]
      summary: Hoàn tất dọn phòng CLEANING
      operationId: completeCleaning
      description: |
        API giới hạn cho vai trò `HOUSEKEEPER` để đánh dấu phòng đã được dọn.

        Phòng phải tồn tại và đang ở trạng thái `CLEANING`. Backend khóa phòng
        trong transaction trước khi kiểm tra và chuyển trạng thái. Khi thành
        công, phòng chuyển từ `CLEANING` sang `AVAILABLE` và có thể được dùng
        cho nghiệp vụ tiếp theo.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200":
          description: Đã hoàn tất dọn phòng; trạng thái phòng là AVAILABLE.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomMutationResponse"
              example:
                success: true
                message: Đã hoàn tất dọn phòng
                data:
                  roomId: 10000000-0000-0000-0000-000000000001
                  roomNumber: DLX-101
                  floor: 1
                  status: AVAILABLE
                  note: Khách yêu cầu kiểm tra minibar
                  roomType:
                    id: 20000000-0000-0000-0000-000000000001
                    code: DLX
                    name: Deluxe hướng biển
                timestamp: "2026-08-28T08:00:00Z"
        "400":
          description: "roomId không phải UUID hợp lệ (VALIDATION_FAILED)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: "Không tìm thấy phòng (ROOM_NOT_FOUND)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              example:
                code: ROOM_NOT_FOUND
                message: Không tìm thấy phòng đang dọn
                path: /api/v1/housekeeping/rooms/10000000-0000-0000-0000-000000000001/complete-cleaning
                timestamp: "2026-08-28T08:00:00Z"
                errors: {}
        "409":
          description: "Phòng không còn ở trạng thái CLEANING (ROOM_CLEANING_COMPLETE_CONFLICT)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              example:
                code: ROOM_CLEANING_COMPLETE_CONFLICT
                message: Không thể hoàn tất dọn khi phòng đang ở trạng thái AVAILABLE
                path: /api/v1/housekeeping/rooms/10000000-0000-0000-0000-000000000001/complete-cleaning
                timestamp: "2026-08-28T08:00:00Z"
                errors: {}
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/AccessForbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/housekeeping/dirty-rooms:
    get:
      tags: [Housekeeping]
      summary: Xem danh sách phòng cần dọn
      description: |
        API giới hạn cho vai trò `HOUSEKEEPER`.

        Chỉ phòng vật lý có trạng thái `DIRTY` được trả về. Kết quả được sắp
        xếp theo tầng tăng dần, sau đó theo số phòng tăng dần để bảo đảm thứ tự
        ổn định. Danh sách rỗng vẫn trả `200 OK` với `content=[]`.
      operationId: getDirtyRooms
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Lấy danh sách phòng cần dọn thành công; content có thể rỗng
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirtyRoomsResponse"
              examples:
                withData:
                  summary: Có phòng cần dọn
                  value:
                    success: true
                    message: Lấy danh sách phòng cần dọn thành công
                    data:
                      content:
                        - roomId: 10000000-0000-0000-0000-000000000001
                          roomNumber: DLX-101
                          floor: 1
                          status: DIRTY
                          note: Khách yêu cầu kiểm tra minibar
                          roomType:
                            id: 20000000-0000-0000-0000-000000000001
                            code: DLX
                            name: Deluxe hướng biển
                      page: 0
                      size: 20
                      totalElements: 1
                      totalPages: 1
                      first: true
                      last: true
                    timestamp: "2026-08-20T08:00:00Z"
                empty:
                  summary: Không có phòng cần dọn
                  value:
                    success: true
                    message: Lấy danh sách phòng cần dọn thành công
                    data:
                      content: []
                      page: 0
                      size: 20
                      totalElements: 0
                      totalPages: 0
                      first: true
                      last: true
                    timestamp: "2026-08-20T08:00:00Z"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/AccessForbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token của tài khoản nhân sự HANBAY

  parameters:
    RoomId:
      name: roomId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      description: Số trang, bắt đầu từ 0
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      description: Số phòng trên một trang
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    RoomMutationSucceeded:
      description: Cập nhật trạng thái phòng thành công
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RoomMutationResponse"
    ValidationFailed:
      description: Query parameter không hợp lệ
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
          example:
            code: VALIDATION_FAILED
            message: Dữ liệu gửi lên không hợp lệ
            path: /api/v1/housekeeping/dirty-rooms
            timestamp: "2026-08-20T08:00:00Z"
            errors:
              size: Số phần tử mỗi trang phải từ 1 đến 100
    AuthenticationRequired:
      description: Thiếu, sai hoặc hết hạn access token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
          example:
            code: AUTH_UNAUTHORIZED
            message: Bạn cần đăng nhập để thực hiện thao tác này
            path: /api/v1/housekeeping/dirty-rooms
            timestamp: "2026-08-20T08:00:00Z"
            errors: {}
    AccessForbidden:
      description: Tài khoản không có vai trò HOUSEKEEPER
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
          example:
            code: AUTH_FORBIDDEN
            message: Bạn không có quyền truy cập
            path: /api/v1/housekeeping/dirty-rooms
            timestamp: "2026-08-20T08:00:00Z"
            errors: {}
    InternalServerError:
      description: Lỗi hệ thống ngoài dự kiến
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
          example:
            code: INTERNAL_SERVER_ERROR
            message: Đã xảy ra lỗi hệ thống
            path: /api/v1/housekeeping/dirty-rooms
            timestamp: "2026-08-20T08:00:00Z"
            errors: {}

  schemas:
    DirtyRoomsResponse:
      type: object
      additionalProperties: false
      required: [success, message, data, timestamp]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Lấy danh sách phòng cần dọn thành công
        data:
          $ref: "#/components/schemas/DirtyRoomsPage"
        timestamp:
          type: string
          format: date-time

    RoomMutationResponse:
      type: object
      additionalProperties: false
      required: [success, message, data, timestamp]
      properties:
        success:
          type: boolean
          enum: [true]
        message:
          type: string
          example: Đã hoàn tất dọn phòng
        data:
          $ref: "#/components/schemas/DirtyRoomItem"
        timestamp:
          type: string
          format: date-time

    DirtyRoomsPage:
      type: object
      additionalProperties: false
      required: [content, page, size, totalElements, totalPages, first, last]
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/DirtyRoomItem"
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
        first:
          type: boolean
        last:
          type: boolean

    DirtyRoomItem:
      type: object
      additionalProperties: false
      required: [roomId, roomNumber, floor, status, note, roomType]
      properties:
        roomId:
          type: string
          format: uuid
        roomNumber:
          type: string
          maxLength: 30
          example: DLX-101
        floor:
          type: integer
          format: int32
          example: 1
        status:
          type: string
          enum: [DIRTY, CLEANING, AVAILABLE]
        note:
          type: string
          nullable: true
          description: Ghi chú vận hành hiện tại của phòng
          example: Khách yêu cầu kiểm tra minibar
        roomType:
          $ref: "#/components/schemas/DirtyRoomTypeSummary"

    DirtyRoomTypeSummary:
      type: object
      additionalProperties: false
      required: [id, code, name]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          maxLength: 50
          example: DLX
        name:
          type: string
          maxLength: 150
          example: Deluxe hướng biển

    ApiErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message, path, timestamp, errors]
      properties:
        code:
          type: string
        message:
          type: string
        path:
          type: string
        timestamp:
          type: string
          format: date-time
        errors:
          type: object
          additionalProperties:
            type: string
