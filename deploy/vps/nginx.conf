# Only the host Nginx can reach the published loopback port. Trust its real IP
# header from this Docker gateway, then send a fresh forwarding chain to Spring.
map "$realip_remote_addr:$http_x_forwarded_proto" $origin_scheme {
    default $scheme;
    "172.30.68.1:https" https;
}
map $origin_scheme $origin_port { default 80; https 443; }
server {
    listen 80;
    server_name _;
    client_max_body_size 6m;
    root /usr/share/nginx/html;
    index index.html;
    set_real_ip_from 172.30.68.1;
    real_ip_header X-Real-IP;
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Forwarded "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $origin_scheme;
        proxy_set_header X-Forwarded-Port $origin_port;
        proxy_set_header X-Forwarded-Prefix "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
    location / { try_files $uri $uri/ /index.html; }
}
