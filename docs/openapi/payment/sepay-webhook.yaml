openapi: 3.1.0
info:
  title: API thanh toán HANBAY HOTEL
  version: 1.0.0
  description: Đặc tả thanh toán chuyển khoản và webhook từ SePay.

servers:
  - url: http://localhost:8080

paths:
  /api/v1/payments/requests:
    $ref: './create-payment-request.yaml#/paths/~1api~1v1~1payments~1requests'

  /api/v1/payments/{paymentId}:
    get:
      tags: [Payments]
      summary: Tra cứu payment
      security:
        - bearerAuth: []
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Chi tiết payment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/payments/{paymentId}/refunds:
    post:
      tags: [Payments]
      summary: Tạo yêu cầu hoàn tiền
      security:
        - bearerAuth: []
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentRefundRequest'
      responses:
        '201':
          description: Yêu cầu hoàn tiền đã được tạo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRefundResponse'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/payments/sepay/webhook:
    post:
      tags: [SePay]
      summary: Nhận webhook giao dịch ngân hàng từ SePay
      description: |
        Endpoint public cho SePay. Xác thực bằng API key trong header Authorization,
        dùng id giao dịch của SePay để chống xử lý trùng và đối soát mã thanh toán.
        Khi nhận đủ tiền, hệ thống chuyển payment sang SUCCESS và tự động xác nhận
        đặt phòng PENDING còn hạn. Thanh toán thiếu được cộng dồn; khi nhận đủ tiền
        sau lúc booking hết hiệu lực hoặc cho payment đã CANCELLED/FAILED/EXPIRED,
        hệ thống không xác nhận booking; mỗi giao dịch đến trễ, kể cả chuyển thiếu,
        tạo một refund PENDING đúng bằng số tiền giao dịch. Nếu booking còn hiệu lực nhưng khách chuyển thừa,
        booking vẫn được xác nhận và refund PENDING được tạo đúng bằng phần tiền dư.
      security:
        - sepayApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SePayWebhookRequest'
      responses:
        '200':
          description: Webhook đã được tiếp nhận, kể cả event trùng.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SePayWebhookAcknowledgement'
              example:
                success: true
                message: Webhook đã được tiếp nhận
        '400':
          description: Payload vi phạm validation hoặc không đúng định dạng JSON/ngày giờ/enum.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              examples:
                validationFailed:
                  summary: Dữ liệu không hợp lệ
                  value:
                    code: VALIDATION_FAILED
                    message: Dữ liệu gửi lên không hợp lệ
                    path: /api/v1/payments/sepay/webhook
                    timestamp: '2026-08-09T13:30:00Z'
                    errors:
                      transferAmount: phải lớn hơn 0
                malformedRequest:
                  summary: JSON hoặc kiểu dữ liệu không đúng định dạng
                  value:
                    code: MALFORMED_REQUEST
                    message: Nội dung yêu cầu không đúng định dạng
                    path: /api/v1/payments/sepay/webhook
                    timestamp: '2026-08-09T13:30:00Z'
                    errors: {}
        '401':
          description: API key không hợp lệ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                code: INVALID_WEBHOOK_API_KEY
                message: API key webhook không hợp lệ
                path: /api/v1/payments/sepay/webhook
                timestamp: '2026-08-09T13:30:00Z'
                errors: {}
        '500':
          description: Không thể lưu event do lỗi nội bộ hoặc database.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    sepayApiKey:
      type: apiKey
      in: header
      name: Authorization
      description: Giá trị có dạng `Apikey <SEPAY_WEBHOOK_API_KEY>`.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        maxLength: 120

  responses:
    Conflict:
      description: Xung đột trạng thái hoặc idempotency key đã dùng cho request khác.
    NotFound:
      description: Không tìm thấy tài nguyên.

  schemas:
    PaymentResponse:
      type: object
      required: [paymentId, bookingId, bookingCode, transactionRef, amount, currency, status, expiredAt, createdAt]
      properties:
        paymentId: { type: string, format: uuid }
        bookingId: { type: string, format: uuid }
        bookingCode: { type: string, maxLength: 50 }
        transactionRef: { type: string, maxLength: 80 }
        amount: { type: integer, format: int64, minimum: 1 }
        currency: { type: string, const: VND }
        status:
          $ref: '#/components/schemas/PaymentStatus'
        paymentUrl: { type: [string, 'null'], format: uri }
        expiredAt: { type: string, format: date-time }
        paidAt: { type: [string, 'null'], format: date-time }
        failedAt: { type: [string, 'null'], format: date-time }
        cancelledAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: [string, 'null'], format: date-time }

    CreatePaymentRefundRequest:
      type: object
      additionalProperties: false
      required: [amount]
      properties:
        amount:
          type: number
          format: decimal
          minimum: 0.01
          multipleOf: 0.01
        reason: { type: [string, 'null'], maxLength: 255 }

    PaymentRefundResponse:
      type: object
      required: [refundId, paymentId, amount, currency, status, requestedAt, createdAt, updatedAt]
      properties:
        refundId: { type: string, format: uuid }
        paymentId: { type: string, format: uuid }
        amount: { type: number, format: decimal }
        currency: { type: string, const: VND }
        status:
          type: string
          enum: [PENDING, PROCESSING, SUCCESS, FAILED, CANCELLED]
        reason: { type: [string, 'null'] }
        providerRefundId: { type: [string, 'null'] }
        requestedAt: { type: string, format: date-time }
        refundedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    SePayWebhookRequest:
      type: object
      description: Các field lạ được bỏ qua để tương thích khi SePay bổ sung metadata.
      required:
        - id
        - gateway
        - transactionDate
        - accountNumber
        - content
        - transferType
        - transferAmount
        - accumulated
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        gateway: { type: string, maxLength: 100 }
        transactionDate:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$'
          example: '2026-08-06 16:30:00'
        accountNumber: { type: string, maxLength: 100 }
        subAccount: { type: [string, 'null'], maxLength: 100 }
        code: { type: [string, 'null'], maxLength: 120 }
        content: { type: string, maxLength: 1000 }
        transferType: { type: string, enum: [in, out] }
        transferAmount: { type: integer, format: int64, minimum: 1 }
        accumulated: { type: integer, format: int64, minimum: 0 }
        description: { type: [string, 'null'], maxLength: 1000 }
        referenceCode: { type: [string, 'null'], maxLength: 150 }

    SePayWebhookAcknowledgement:
      type: object
      additionalProperties: false
      required: [success, message]
      properties:
        success: { type: boolean, const: true }
        message: { type: string, example: Webhook đã được tiếp nhận }

    ApiErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message, path, timestamp, errors]
      properties:
        code: { type: string }
        message: { type: string }
        path: { type: string }
        timestamp: { type: string, format: date-time }
        errors:
          type: object
          additionalProperties: { type: string }

    PaymentStatus:
      type: string
      enum: [PENDING, SUCCESS, FAILED, CANCELLED, REFUNDED, EXPIRED, PARTIALLY_REFUNDED]
