openapi: 3.0.3

info:
  title: Manager dashboard report API
  version: 1.0.0
  description: Báo cáo doanh thu, công suất phòng và booking cho HAN-237.

servers:
  - url: http://localhost:8080

tags:
  - name: Báo cáo quản lý

paths:
  /api/v1/reports/dashboard:
    get:
      tags: [Báo cáo quản lý]
      operationId: getManagerDashboardReport
      summary: Lấy báo cáo tổng quan hoạt động khách sạn
      description: |
        Chỉ `MANAGER` và `ADMIN` được truy cập. Khoảng ngày là `[from,to)` theo
        múi giờ `Asia/Ho_Chi_Minh` và không được vượt quá 366 ngày.
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          required: true
          description: Ngày đầu tiên được tính trong báo cáo
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          description: Ngày kết thúc không được tính trong báo cáo
          schema:
            type: string
            format: date
        - name: currency
          in: query
          required: false
          schema:
            type: string
            pattern: "^[A-Z]{3}$"
            default: VND
      responses:
        "200":
          description: Lấy báo cáo dashboard thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardApiResponse"
              example:
                success: true
                message: Lấy báo cáo dashboard thành công
                data:
                  period: {from: "2026-08-01", to: "2026-08-04", currency: VND}
                  revenue: {grossRevenue: 1200000, refundedAmount: 200000, netRevenue: 1000000}
                  occupancy: {occupiedRoomNights: 9, availableRoomNights: 12, occupancyRate: 75.00}
                  bookings:
                    totalBookings: 4
                    pendingBookings: 0
                    confirmedBookings: 2
                    checkedInBookings: 0
                    checkedOutBookings: 1
                    cancelledBookings: 1
                    expiredBookings: 0
                    totalBookingValue: 2000000
                    averageBookingValue: 500000
                    cancellationRate: 25.00
                  revenueTrend: []
                  occupancyTrend: []
                  bookingTrend: []
                timestamp: "2026-08-20T09:00:00Z"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/AccessForbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    DashboardApiResponse:
      type: object
      required: [success, message, data, timestamp]
      properties:
        success: {type: boolean}
        message: {type: string}
        data:
          $ref: "#/components/schemas/DashboardReport"
        timestamp: {type: string, format: date-time}
    DashboardReport:
      type: object
      required: [period, revenue, occupancy, bookings, revenueTrend, occupancyTrend, bookingTrend]
      properties:
        period:
          type: object
          properties:
            from: {type: string, format: date}
            to: {type: string, format: date}
            currency: {type: string}
        revenue:
          $ref: "#/components/schemas/Revenue"
        occupancy:
          $ref: "#/components/schemas/Occupancy"
        bookings:
          $ref: "#/components/schemas/Bookings"
        revenueTrend:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/Revenue"
              - type: object
                properties:
                  date: {type: string, format: date}
        occupancyTrend:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/Occupancy"
              - type: object
                properties:
                  date: {type: string, format: date}
        bookingTrend:
          type: array
          items:
            type: object
            properties:
              date: {type: string, format: date}
              totalBookings: {type: integer, format: int64}
    Revenue:
      type: object
      properties:
        grossRevenue: {type: integer, format: int64}
        refundedAmount: {type: integer, format: int64}
        netRevenue: {type: integer, format: int64}
    Occupancy:
      type: object
      properties:
        occupiedRoomNights: {type: integer, format: int64}
        availableRoomNights: {type: integer, format: int64}
        occupancyRate: {type: number, format: double}
    Bookings:
      type: object
      properties:
        totalBookings: {type: integer, format: int64}
        pendingBookings: {type: integer, format: int64}
        confirmedBookings: {type: integer, format: int64}
        checkedInBookings: {type: integer, format: int64}
        checkedOutBookings: {type: integer, format: int64}
        cancelledBookings: {type: integer, format: int64}
        expiredBookings: {type: integer, format: int64}
        totalBookingValue: {type: integer, format: int64}
        averageBookingValue: {type: integer, format: int64}
        cancellationRate: {type: number, format: double}
    ApiErrorResponse:
      type: object
      properties:
        code: {type: string}
        message: {type: string}
        path: {type: string}
        timestamp: {type: string, format: date-time}
        errors:
          type: object
          additionalProperties: {type: string}

  responses:
    ValidationFailed:
      description: Date range hoặc currency không hợp lệ
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    AuthenticationRequired:
      description: Access token thiếu, sai hoặc hết hạn
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    AccessForbidden:
      description: Tài khoản không có role MANAGER hoặc ADMIN
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    InternalServerError:
      description: Lỗi hệ thống khi tổng hợp báo cáo
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
