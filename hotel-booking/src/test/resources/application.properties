jwt.issuer=hotel-booking-test
jwt.secret=test-jwt-secret-with-at-least-32-characters
jwt.access-token-expiration-seconds=900
jwt.refresh-token-expiration-seconds=604800

# Tests must not create external AI clients or ingest policy embeddings unless a test
# explicitly enables RAG and supplies its own deterministic EmbeddingModel.
spring.ai.model.chat=none
spring.ai.model.embedding=none
ai.policy-rag.rag-enabled=false
spring.docker.compose.enabled=false
