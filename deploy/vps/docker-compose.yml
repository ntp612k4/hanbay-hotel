services:
  backend:
    image: ${BACKEND_IMAGE}
    platform: linux/amd64
    restart: unless-stopped
    networks: [default, proxy]
    environment:
      TRUSTED_PROXY_REGEX: "172[.]30[.]68[.]10"
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-hotel-images}
      JAVA_TOOL_OPTIONS: >-
        -Xms128m
        -Xmx512m
        -XX:+UseG1GC
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TOKEN_EXPIRATION_SECONDS: ${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:-3600}
      JWT_ISSUER: ${JWT_ISSUER:-hotel-booking-system}
      REFRESH_TOKEN_EXPIRATION_SECONDS: ${REFRESH_TOKEN_EXPIRATION_SECONDS:-604800}
      CORS_ALLOWED_ORIGINS: ${PUBLIC_URL}
      ADMIN_DEFAULT_ENABLED: ${ADMIN_DEFAULT_ENABLED:-false}
      ADMIN_DEFAULT_EMAIL: ${ADMIN_DEFAULT_EMAIL:-admin@hanbay.local}
      ADMIN_DEFAULT_PHONE: ${ADMIN_DEFAULT_PHONE:-0900000001}
      ADMIN_DEFAULT_FULL_NAME: ${ADMIN_DEFAULT_FULL_NAME:-Hanbay Admin}
      ADMIN_DEFAULT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD:-}
      AI_CHAT_MODEL: openai
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-openai}
      AI_POLICY_RAG_ENABLED: ${AI_POLICY_RAG_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_EMBEDDING_DIMENSIONS: ${OPENAI_EMBEDDING_DIMENSIONS:-1536}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-onboarding@resend.dev}
      PASSWORD_RESET_FRONTEND_URL: ${PUBLIC_URL}/reset-password
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-support@hanbay-hotel.local}
      SEPAY_BANK_CODE: ${SEPAY_BANK_CODE:-Vietcombank}
      SEPAY_BANK_ACCOUNT_NUMBER: ${SEPAY_BANK_ACCOUNT_NUMBER:-0000000002}
      SEPAY_BANK_ACCOUNT_NAME: ${SEPAY_BANK_ACCOUNT_NAME:-CONG TY TNHH HANBAY HOTEL}
      SEPAY_WEBHOOK_API_KEY: ${SEPAY_WEBHOOK_API_KEY:?Set SEPAY_WEBHOOK_API_KEY in .env}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 10

  frontend:
    image: ${FRONTEND_IMAGE:?Set FRONTEND_IMAGE in .env}
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HTTP_PORT:-8081}:80"
    networks:
      proxy:
        ipv4_address: 172.30.68.10
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy

  postgres:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg17}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    restart: unless-stopped
    environment:
      MINIO_BROWSER_REDIRECT_URL: https://minio.phuocanh.me
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY}
    ports:
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: ${REDIS_IMAGE:-redis:8}
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  minio_data:
  postgres_data:
  redis_data:

networks:
  proxy:
    ipam:
      config:
        - subnet: 172.30.68.0/24
