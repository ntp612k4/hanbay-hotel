info:
  title: Booking API
  version: 1.0.0
  description: API tạo booking chờ thanh toán

openapi: 3.0.3

paths:
  /api/v1/bookings:
    post:
      tags:
        - Booking

      summary: Tạo booking chờ thanh toán

      description: >
        API tạo mới một booking với trạng thái PENDING.
        Sau khi tạo thành công, hệ thống sẽ giữ phòng trong 15 phút
        để khách thực hiện thanh toán.

        ### Business Rules

        - Booking được giữ tối đa 15 phút.

        - Booking PENDING vẫn được tính là đã giữ phòng.

        - Sau 15 phút scheduler chuyển booking sang EXPIRED.

        - Hệ thống kiểm tra lại số lượng phòng trong transaction.

        Payment chưa thuộc phạm vi API hiện tại và sẽ được bổ sung ở task sau.

      operationId: createPendingBooking

      security: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePendingBookingRequest"

      responses:
        "201":
          description: Tạo booking thành công

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatePendingBookingResponse"

        "400":
          description: Dữ liệu gửi lên không hợp lệ

        "404":
          description: Không tìm thấy hạng phòng

        "409":
          description: Hết phòng trong khoảng thời gian yêu cầu

components:
  schemas:
    CreatePendingBookingRequest:
      type: object

      required:
        - roomTypeId
        - checkInDate
        - checkOutDate
        - adults
        - guestInfo

      properties:
        roomTypeId:
          type: string
          format: uuid
          description: ID của hạng phòng

        checkInDate:
          type: string
          format: date
          description: Ngày nhận phòng

        checkOutDate:
          type: string
          format: date
          description: Ngày trả phòng

        adults:
          type: integer
          minimum: 1
          description: Số lượng người lớn

        children:
          type: integer
          minimum: 0
          description: Số lượng trẻ em

        guestInfo:
          $ref: "#/components/schemas/GuestInfo"

        addOns:
          type: array
          description: Danh sách dịch vụ đi kèm và số lượng; backend lấy và snapshot giá hiện tại.
          items:
            $ref: "#/components/schemas/AddOnSelection"

    AddOnSelection:
      type: object
      required: [addOnServiceId, quantity]
      properties:
        addOnServiceId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
          maximum: 20

    GuestInfo:
      type: object

      required:
        - fullName
        - email
        - identityNumber

      properties:
        fullName:
          type: string
          description: Họ và tên khách đặt phòng

        email:
          type: string
          format: email
          description: Email liên hệ

        phone:
          type: string
          pattern: '^0\d{9}$'
          nullable: true
          description: Số điện thoại liên hệ

        identityNumber:
          type: string
          description: Số giấy tờ tùy thân/CCCD của khách
          example: "012345678901"

    CreatePendingBookingResponse:
      type: object

      properties:
        success:
          type: boolean

        message:
          type: string
          example: Tạo booking thành công

        data:
          $ref: "#/components/schemas/BookingSummary"

        timestamp:
          type: string
          format: date-time

    BookingSummary:
      type: object

      properties:
        bookingId:
          type: string
          format: uuid
          description: ID booking

        bookingCode:
          type: string
          description: Mã booking

        status:
          type: string
          enum:
            - PENDING
          description: Trạng thái booking

        totalAmount:
          type: integer
          format: int64
          minimum: 0
          description: Tổng tiền cần thanh toán, đơn vị VND

        expiredAt:
          type: string
          format: date-time
          description: Thời điểm booking hết hiệu lực
