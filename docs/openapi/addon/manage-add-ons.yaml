openapi: 3.0.3
info:
  title: HANBAY Hotel Add-on Management API
  version: 1.0.0
  description: Contract quản lý danh mục dịch vụ bổ sung cho manager và administrator.

servers:
  - url: http://localhost:8080
    description: Môi trường phát triển cục bộ

tags:
  - name: Add-on Management
    description: Quản lý dịch vụ bổ sung dùng trong booking

paths:
  /api/v1/management/add-ons:
    get:
      tags: [Add-on Management]
      summary: Tra cứu danh mục dịch vụ bổ sung
      operationId: getManagedAddOns
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: search
          in: query
          description: Tìm không phân biệt hoa thường theo code hoặc name.
          schema:
            type: string
            maxLength: 150
        - name: active
          in: query
          description: Bỏ qua để lấy cả active và inactive.
          schema:
            type: boolean
        - name: sort
          in: query
          description: Trường và chiều sắp xếp; chỉ cho phép name, code, price, active, createdAt.
          schema:
            type: string
            default: name,asc
            pattern: '^(name|code|price|active|createdAt),(asc|desc)$'
      responses:
        '200':
          description: Tra cứu thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddOnPageApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Add-on Management]
      summary: Tạo dịch vụ bổ sung
      operationId: createAddOn
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAddOnRequest'
      responses:
        '201':
          description: Tạo thành công. Header Location trỏ đến resource vừa tạo.
          headers:
            Location:
              schema:
                type: string
              example: /api/v1/management/add-ons/4c2ff15b-c288-4722-b4b8-8e73d3f55337
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddOnApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/management/add-ons/{id}:
    parameters:
      - $ref: '#/components/parameters/AddOnId'
    get:
      tags: [Add-on Management]
      summary: Xem chi tiết dịch vụ bổ sung
      operationId: getManagedAddOn
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Tra cứu thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddOnApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [Add-on Management]
      summary: Cập nhật thông tin và giá dịch vụ bổ sung
      operationId: updateAddOn
      description: Code và trạng thái không thể cập nhật qua endpoint này; snapshot booking cũ không thay đổi.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAddOnRequest'
      responses:
        '200':
          description: Cập nhật thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddOnApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/management/add-ons/{id}/status:
    parameters:
      - $ref: '#/components/parameters/AddOnId'
    patch:
      tags: [Add-on Management]
      summary: Kích hoạt hoặc ngừng kích hoạt dịch vụ bổ sung
      operationId: updateAddOnStatus
      description: Deactivate thay cho hard-delete; inactive add-on không xuất hiện trong public catalog.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAddOnStatusRequest'
      responses:
        '200':
          description: Cập nhật trạng thái thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddOnApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token phải chứa role MANAGER hoặc ADMIN.

  parameters:
    AddOnId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  schemas:
    CreateAddOnRequest:
      type: object
      additionalProperties: false
      required: [code, name, price]
      properties:
        code:
          type: string
          minLength: 2
          maxLength: 50
          pattern: '^[A-Z][A-Z0-9_]*$'
          example: BA_NA_HILLS_TICKET
        name:
          type: string
          minLength: 2
          maxLength: 150
          example: Vé tham quan Bà Nà Hills
        description:
          type: string
          nullable: true
          maxLength: 2000
          example: Vé vào cổng dành cho một khách.
        price:
          type: integer
          format: int64
          minimum: 0
          example: 950000
    UpdateAddOnRequest:
      type: object
      additionalProperties: false
      required: [name, price]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 150
        description:
          type: string
          nullable: true
          maxLength: 2000
        price:
          type: integer
          format: int64
          minimum: 0
    UpdateAddOnStatusRequest:
      type: object
      additionalProperties: false
      required: [active]
      properties:
        active:
          type: boolean
    AddOnManagementResponse:
      type: object
      required: [id, code, name, price, active, createdAt]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        price:
          type: integer
          format: int64
          minimum: 0
          description: Giá hiện hành, đơn vị VND.
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          nullable: true
    AddOnPage:
      type: object
      required: [content, page, size, totalElements, totalPages, first, last]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/AddOnManagementResponse'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
        first:
          type: boolean
        last:
          type: boolean
    AddOnApiResponse:
      type: object
      required: [success, message, data, timestamp]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
          $ref: '#/components/schemas/AddOnManagementResponse'
        timestamp:
          type: string
          format: date-time
    AddOnPageApiResponse:
      type: object
      required: [success, message, data, timestamp]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Lấy danh sách dịch vụ bổ sung thành công
        data:
          $ref: '#/components/schemas/AddOnPage'
        timestamp:
          type: string
          format: date-time
    ApiErrorResponse:
      type: object
      required: [code, message, path, timestamp, errors]
      properties:
        code:
          type: string
          example: VALIDATION_FAILED
        message:
          type: string
        path:
          type: string
        timestamp:
          type: string
          format: date-time
        errors:
          type: object
          additionalProperties:
            type: string

  responses:
    BadRequest:
      description: Request, query parameter hoặc UUID không hợp lệ.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    Unauthorized:
      description: Thiếu access token, token không hợp lệ hoặc hết hạn.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    Forbidden:
      description: Tài khoản không có role MANAGER hoặc ADMIN.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    NotFound:
      description: Không tìm thấy dịch vụ bổ sung.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    Conflict:
      description: Code đã tồn tại hoặc có xung đột dữ liệu đồng thời.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    InternalServerError:
      description: Lỗi hệ thống ngoài dự kiến.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
