openapi: 3.0.3
info:
  title: HANBAY Unified AI Chat
  version: 1.0.0
paths:
  /api/v1/ai/chat/stream:
    post:
      summary: Stream a conversation with the unified hotel AI assistant
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [conversationId, message]
              additionalProperties: false
              properties:
                conversationId:
                  type: string
                  format: uuid
                message:
                  type: string
                  minLength: 1
      responses:
        '200':
          description: SSE events of type delta, action, sources, done, or error
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          description: Invalid request
        '401':
          description: Authentication required
        '429':
          description: Rate limit exceeded
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
