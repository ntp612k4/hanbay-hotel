openapi: 3.0.3

info:
  title: API check-out khách HANBAY Hotel
  version: 1.0.0
  description: >
    Contract cho thao tác lễ tân check-out booking đã check-in. API hoàn tất
    booking, đánh dấu phòng vật lý đã gán thành DIRTY và trả về snapshot công nợ
    cuối cùng để giao diện lễ tân cập nhật.

servers:
  - url: http://localhost:8080
    description: Môi trường phát triển cục bộ

tags:
  - name: Front Desk
    description: Nghiệp vụ tại quầy lễ tân

paths:
  /api/v1/bookings/{bookingId}/check-out:
    patch:
      tags: [Front Desk]
      summary: Check-out khách
      operationId: checkOutGuest
      description: |
        Chỉ người dùng có vai trò `RECEPTIONIST`, `MANAGER` hoặc `ADMIN` được gọi API này.

        Phần implementation check-out phải khóa booking và phòng vật lý đã gán,
        kiểm tra trạng thái hiện tại và cập nhật dữ liệu trong cùng một transaction.

        Quy tắc nghiệp vụ:

        - Booking phải tồn tại và đang ở trạng thái `CHECKED_IN`.
        - Booking phải có phòng vật lý đã gán.
        - Phòng vật lý đã gán được kỳ vọng đang ở trạng thái `OCCUPIED`.
        - Lễ tân có thể ghi nhận phí phát sinh/đền bù sau khi kiểm tra phòng.
        - Nếu có phí phát sinh thì phải có lý do phát sinh.
        - Lễ tân có thể ghi nhận số tiền thu thêm tại quầy trước khi hoàn tất check-out.
        - Công nợ cuối cùng sau phí phát sinh và tiền thu thêm phải bằng `0` trước khi có thể hoàn tất check-out.
        - Khi thành công, booking chuyển sang `CHECKED_OUT`.
        - Khi thành công, phòng vật lý đã gán chuyển sang `DIRTY`.
        - Task implement phải ghi nhận lịch sử trạng thái booking.
        - Nếu scope implement đã có nơi lưu housekeeping task, nên tạo task dọn phòng
          đang chờ xử lý cho phòng dirty. Tối thiểu, room status phải là `DIRTY`
          để Housekeeping lấy được phòng từ API danh sách phòng cần dọn.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BookingId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckOutGuestRequest"
            example:
              note: Khách đã trả đủ chìa khóa
              additionalChargeAmount: 100000
              additionalChargeReason: Mất thẻ phòng
              collectedAmount: 100000
      responses:
        "200":
          description: Check-out khách thành công.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckOutGuestApiResponse"
              example:
                success: true
                message: Trả phòng thành công
                data:
                  bookingId: 8a1f6e4c-5b3a-4d9d-9e3d-4c8a3a9a1001
                  bookingCode: BK20260824000001
                  bookingStatus: CHECKED_OUT
                  room:
                    roomId: 68ba3ad7-ce1a-43ac-b78e-b1bb87c73d2f
                    roomNumber: "0501"
                    floor: 5
                    status: DIRTY
                  checkedOutAt: "2026-08-24T03:30:00Z"
                  totalAmount: 5735000
                  paidAmount: 5735000
                  outstandingAmount: 0
                  additionalChargeAmount: 100000
                  additionalChargeReason: Mất thẻ phòng
                  collectedAmount: 100000
                timestamp: "2026-08-24T03:30:00Z"
        "400":
          description: Body request hoặc UUID không hợp lệ (`VALIDATION_FAILED`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              example:
                code: VALIDATION_FAILED
                message: Dữ liệu không hợp lệ
                path: /api/v1/bookings/8a1f6e4c-5b3a-4d9d-9e3d-4c8a3a9a1001/check-out
                timestamp: "2026-08-24T03:30:00Z"
                errors:
                  note: Ghi chú không được vượt quá 500 ký tự
                  additionalChargeReasonValid: Lý do phát sinh là bắt buộc khi có phí phát sinh
        "401":
          description: Thiếu hoặc access token không hợp lệ (`AUTH_UNAUTHORIZED`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: Người gọi không có vai trò Front Desk được phép (`AUTH_FORBIDDEN`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: Không tìm thấy booking (`BOOKING_NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "409":
          description: |
            Vi phạm quy tắc nghiệp vụ. `code` nhận một trong các giá trị:

            - `BOOKING_NOT_CHECKED_IN`: booking không đang ở trạng thái `CHECKED_IN`.
            - `BOOKING_ALREADY_CHECKED_OUT`: booking đã được check-out trước đó.
            - `ROOM_NOT_ASSIGNED`: booking đã check-in nhưng chưa có phòng vật lý.
            - `ROOM_NOT_OCCUPIED`: phòng đã gán không đang ở trạng thái `OCCUPIED`.
            - `CHECKOUT_OVER_COLLECTION`: số thu thêm vượt công nợ sau cộng phí; tải lại số dư trước khi thử lại.
            - `EARLY_CHECKOUT_REQUIRED`: phải dùng luồng trả phòng sớm trước ngày trả phòng dự kiến.
            - `PAYMENT_REQUIRED`: công nợ cuối cùng sau phí phát sinh và tiền thu thêm lớn hơn `0`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              examples:
                bookingNotCheckedIn:
                  summary: Booking chưa check-in
                  value:
                    code: BOOKING_NOT_CHECKED_IN
                    message: Chỉ booking CHECKED_IN mới có thể check-out
                    path: /api/v1/bookings/8a1f6e4c-5b3a-4d9d-9e3d-4c8a3a9a1001/check-out
                    timestamp: "2026-08-24T03:30:00Z"
                    errors: {}
                paymentRequired:
                  summary: Booking còn công nợ
                  value:
                    code: PAYMENT_REQUIRED
                    message: Booking còn công nợ nên chưa thể check-out
                    path: /api/v1/bookings/8a1f6e4c-5b3a-4d9d-9e3d-4c8a3a9a1001/check-out
                    timestamp: "2026-08-24T03:30:00Z"
                    errors: {}
        "500":
          description: Lỗi hệ thống ngoài dự kiến.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"

components:
  parameters:
    BookingId:
      name: bookingId
      in: path
      required: true
      description: UUID nội bộ của booking cần check-out.
      schema:
        type: string
        format: uuid
        example: 8a1f6e4c-5b3a-4d9d-9e3d-4c8a3a9a1001

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token của tài khoản nhân sự HANBAY.

  schemas:
    CheckOutGuestRequest:
      type: object
      additionalProperties: false
      properties:
        note:
          type: string
          maxLength: 500
          description: Ghi chú tùy chọn của lễ tân tại thời điểm check-out.
        additionalChargeAmount:
          type: integer
          format: int64
          minimum: 0
          maximum: 9999999999
          default: 0
          description: Phí phát sinh hoặc đền bù được ghi nhận sau bước kiểm tra phòng.
        additionalChargeReason:
          type: string
          maxLength: 255
          description: Lý do phát sinh; bắt buộc khi `additionalChargeAmount` lớn hơn 0.
        collectedAmount:
          type: integer
          format: int64
          minimum: 0
          maximum: 9999999999
          default: 0
          description: Tiền mặt thực nhận sau trả tiền thừa, không vượt công nợ sau cộng phí. Không nhập lại tiền chuyển khoản được webhook ghi nhận.

    CheckOutGuestApiResponse:
      type: object
      additionalProperties: false
      required: [success, message, data, timestamp]
      properties:
        success:
          type: boolean
          enum: [true]
        message:
          type: string
        data:
          $ref: "#/components/schemas/CheckOutGuestResult"
        timestamp:
          type: string
          format: date-time

    CheckOutGuestResult:
      type: object
      additionalProperties: false
      required:
        - bookingId
        - bookingCode
        - bookingStatus
        - room
        - checkedOutAt
        - totalAmount
        - paidAmount
        - outstandingAmount
        - additionalChargeAmount
        - collectedAmount
      properties:
        bookingId:
          type: string
          format: uuid
        bookingCode:
          type: string
          example: BK20260824000001
        bookingStatus:
          type: string
          enum: [CHECKED_OUT]
        room:
          $ref: "#/components/schemas/CheckedOutRoom"
        checkedOutAt:
          type: string
          format: date-time
        totalAmount:
          type: number
          minimum: 0
        paidAmount:
          type: number
          minimum: 0
        outstandingAmount:
          type: number
          minimum: 0
          maximum: 0
          description: Phải bằng 0 khi check-out thành công.
        additionalChargeAmount:
          type: integer
          format: int64
          minimum: 0
        additionalChargeReason:
          type: string
          nullable: true
          maxLength: 255
        collectedAmount:
          type: integer
          format: int64
          minimum: 0

    CheckedOutRoom:
      type: object
      additionalProperties: false
      required: [roomId, roomNumber, floor, status]
      properties:
        roomId:
          type: string
          format: uuid
        roomNumber:
          type: string
        floor:
          type: integer
        status:
          type: string
          enum: [DIRTY]

    ApiErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message, path, timestamp, errors]
      properties:
        code:
          type: string
        message:
          type: string
        path:
          type: string
        timestamp:
          type: string
          format: date-time
        errors:
          type: object
          additionalProperties:
            type: string
